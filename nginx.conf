server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Declared once at server level. No location below uses add_header, so
    # every response inherits these (nginx drops them in any location that
    # sets its own add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Client-side routes such as /events/7 fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
